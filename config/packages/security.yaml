security:
    password_hashers:
        # Existing admin passwords were hashed by FOSUserBundle with salted sha512;
        # they keep working and new passwords use the modern "auto" hasher.
        legacy_sha512:
            algorithm: sha512
            encode_as_base64: true
            iterations: 5000
        Sonata\UserBundle\Model\UserInterface:
            algorithm: auto
            migrate_from:
                - legacy_sha512

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_SONATA_ADMIN]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    providers:
        sonata_user_bundle:
            id: sonata.user.security.user_provider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false

        admin:
            lazy: true
            pattern: /admin(.*)
            provider: sonata_user_bundle
            context: user
            form_login:
                login_path: sonata_user_admin_security_login
                check_path: sonata_user_admin_security_check
                default_target_path: sonata_admin_dashboard
                enable_csrf: true
            logout:
                path: sonata_user_admin_security_logout
                target: sonata_user_admin_security_login

        main:
            lazy: true
            context: user

    access_control:
        - { path: ^/admin/login$, role: PUBLIC_ACCESS }
        - { path: ^/admin/logout$, role: PUBLIC_ACCESS }
        - { path: ^/admin/login_check$, role: PUBLIC_ACCESS }
        - { path: ^/admin/resetting, role: PUBLIC_ACCESS }
        - { path: ^/admin/, role: [ROLE_ADMIN, ROLE_SONATA_ADMIN] }
