services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Doctrine/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    admin.page:
        class: App\Admin\PageAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\Page, manager_type: orm, group: 'Content', label: 'Page' }

    admin.products:
        class: App\Admin\ProductAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\Product, manager_type: orm, group: 'Content', label: 'Products' }

    admin.inquiry:
        class: App\Admin\InquiryAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\Inquiry, manager_type: orm, group: 'Content', label: 'Inquiries' }

    admin.url_redirect:
        class: App\Admin\UrlRedirectAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\UrlRedirect, manager_type: orm, group: 'Content', label: 'URL Redirects' }
