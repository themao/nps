services:
  mysql:
    image: mysql:5.7
    ports:
      - 3306:3306
    volumes:
      - mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: nps
      MYSQL_ROOT_PASSWORD: toor

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://root:toor@mysql:3306/nps?serverVersion=5.7.44&charset=utf8
      PHP_IDE_CONFIG: serverName=npp-nps.local
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./:/var/www
    depends_on:
      - mysql

  nginx:
    build: docker/nginx
    ports:
      - "80:80"
    depends_on:
      - php
    volumes:
      - ./web:/var/www/web:ro

volumes:
  mysql:
